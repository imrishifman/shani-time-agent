# Production stack: the agent + Caddy (automatic HTTPS).
# Requires PUBLIC_HOST in .env, e.g. PUBLIC_HOST=34.12.34.56.sslip.io
services:
  app:
    build: .
    env_file: .env
    environment:
      PORT: "3000"
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    expose:
      - "3000"

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
  caddy_config:
